<!doctype html>
<html lang="en" class="bg-[#F8F9FB] light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardly — Official Portal of SHS Virtual Academy</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F8F9FB" id="theme-color-meta" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <script>
      (function() {
        try {
          localStorage.removeItem('boardly_theme');
          localStorage.removeItem('shs_theme');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F8F9FB';
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', '#F8F9FB');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Primary Latin display fonts with font-display: swap for instant text rendering -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
    <!-- Non-critical Arabic & Urdu fonts preloaded asynchronously without blocking initial paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
    </noscript>
  </head>
  <body class="bg-[#F8F9FB] text-slate-900 antialiased selection:bg-[#1E5AFF] selection:text-white">
    <div id="root">
      <!-- Instant First-Paint Branded Skeleton (Rendered before JS execution) -->
      <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8F9FB; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; max-width: 360px; width: 100%; text-align: center; gap: 20px;">
          <!-- Logo with subtle pulse -->
          <div style="width: 56px; height: 56px; border-radius: 16px; background: #0A1330; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(30, 90, 255, 0.25); border: 2px solid #1E5AFF;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E5AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div>
            <div style="font-size: 20px; font-weight: 900; color: #0A1330; letter-spacing: 0.5px; margin-bottom: 4px;">BOARDLY</div>
            <div style="font-size: 11px; font-weight: 700; color: #1E5AFF; text-transform: uppercase; letter-spacing: 1px;">SHS Virtual Academy</div>
          </div>
          <!-- Shimmer Progress Bar -->
          <div style="width: 160px; height: 4px; background: #E2E8F0; border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 50%; background: #1E5AFF; border-radius: 9999px; animation: boardlyPreloadPulse 1.2s infinite ease-in-out;"></div>
          </div>

          <div id="preloader-timeout-action" style="display: none; margin-top: 8px; text-align: center;">
            <p style="font-size: 11px; color: #64748B; margin-bottom: 8px;">Taking longer than usual?</p>
            <button onclick="window.location.reload()" style="background: #1E5AFF; color: #FFFFFF; border: none; padding: 8px 16px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(30, 90, 255, 0.2);">Refresh Page</button>
          </div>
        </div>
        <script>
          setTimeout(function() {
            var action = document.getElementById('preloader-timeout-action');
            if (action && document.getElementById('initial-preloader')) {
              action.style.display = 'block';
            }
          }, 8000);
        </script>
        <style>
          @keyframes boardlyPreloadPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
