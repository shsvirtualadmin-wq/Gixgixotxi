<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Boardly by SHS Virtual Academy provides MCQ practice and test prep for FSC Matric and Post FSC students." />
    <meta property="og:title" content="Boardly — MCQ Practice for FSC & Matric" />
    <meta property="og:description" content="Boardly by SHS Virtual Academy provides MCQ practice and test prep for FSC Matric and Post FSC students." />
    <meta property="og:image" content="/assets/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Boardly — MCQ Practice for FSC & Matric</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('boardly-theme');
          var theme = 'dark';
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
