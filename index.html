<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Boardly: making education accessible to everyone. Free to start, affordable to grow. A project of SHS Virtual Academy." />
    <meta property="og:title" content="Boardly — MCQ Practice for FSC & Matric" />
    <meta property="og:description" content="Boardly: making education accessible to everyone. Free to start, affordable to grow. A project of SHS Virtual Academy." />
    <meta property="og:image" content="/assets/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Boardly — MCQ Practice for FSC & Matric</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('boardly-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = 'dark';
          if (saved === 'light') effective = 'light';
          else if (saved === 'dark') effective = 'dark';
          else if (saved === 'system' || !saved) effective = systemDark ? 'dark' : 'light';

          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-theme-setting', saved || 'system');
          document.documentElement.style.colorScheme = effective;
          if (effective === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', effective === 'dark' ? '#000000' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
