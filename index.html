<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('boardly_theme') || localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          // Kick off first-screen public API fetches in parallel with JS download
          var p = window.location.pathname.toLowerCase();
          if (
            p === '/' ||
            p.startsWith('/commons') ||
            p.startsWith('/dashboard/commons') ||
            p === '/dashboard'
          ) {
            window.__BOARDLY_EARLY_POSTS__ = fetch('/api/posts?limit=15&offset=0&sort=newest', {
              credentials: 'same-origin',
            })
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .catch(function () {
                return null;
              });
          }
          if (p.startsWith('/dashboard') || p.startsWith('/universities') || p.startsWith('/test')) {
            window.__BOARDLY_EARLY_UNIVERSITIES__ = fetch('/api/universities', {
              credentials: 'same-origin',
            })
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .catch(function () {
                return null;
              });
          }
          // One-time service worker and stale cache cleanup
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister().catch(function () {});
              }
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                if (keys[j].indexOf('boardly-') === 0) {
                  caches.delete(keys[j]).catch(function () {});
                }
              }
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <title>Boardly — Pakistan's Smart Exam Prep &amp; Student Community</title>
    <meta name="description" content="Practice university entry test MCQs for MDCAT, NUST NET, FAST, GIKI &amp; ECAT, track weak chapters, and share solved past papers and study notes on Boardly Commons." />

    <!-- Critical First-Paint App Shell & Skeleton CSS (0ms before JS loads) -->
    <style>
      html[data-theme="dark"] body { background-color: #0a0a0c; color: #f5f5f7; }
      html[data-theme="light"] body { background-color: #f5f5f7; color: #141416; }
      body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
      @keyframes b-shimmer { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
      .b-boot-shell { max-width: 672px; margin: 0 auto; padding: 14px 14px 104px; box-sizing: border-box; }
      .b-boot-card {
        border-radius: 26px;
        padding: 16px;
        margin-bottom: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
      }
      html[data-theme="light"] .b-boot-card {
        border: 1px solid rgba(0,0,0,0.08);
        background: #ffffff;
      }
      .b-boot-bar {
        border-radius: 8px;
        background: rgba(255,255,255,0.09);
        animation: b-shimmer 1.5s ease-in-out infinite;
      }
      html[data-theme="light"] .b-boot-bar {
        background: rgba(0,0,0,0.07);
      }
      .b-boot-row { display: flex; align-items: center; gap: 12px; }
      .b-boot-circle { width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0; }
      .b-boot-dock {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        width: min(92vw, 420px);
        height: 60px;
        border-radius: 9999px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(18,18,22,0.88);
      }
      html[data-theme="light"] .b-boot-dock {
        border: 1px solid rgba(0,0,0,0.08);
        background: rgba(255,255,255,0.9);
      }
    </style>

    <!-- Structured Data -->
