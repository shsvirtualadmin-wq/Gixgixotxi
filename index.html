    {
      "@type": "Question",
      "name": "What is Boardly?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Boardly is an online MCQ practice and test preparation platform for Pakistani students. It serves Matric (SSC), Intermediate (FSC/ICS), and university entrance test candidates (MDCAT/TCAT). Features include chapter-wise question banks, timed mock exams, step-by-step derivations, and 24/7 AI tutoring for active exam revision."
      }
    },
    {
      "@type": "Question",
      "name": "Which subjects and exams does Boardly cover?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Boardly covers FBISE and provincial board curricula for SSC (Classes 9 & 10) and HSSC (Classes 11 & 12). Supported subjects include Physics, Chemistry, Biology, Mathematics, Computer Science, English, Urdu, and Islamiat. It also provides dedicated entrance test modules for PMDC MDCAT (Medical) and UET Taxila TCAT (Engineering)."
      }
    },
    {
      "@type": "Question",
      "name": "Is Boardly free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, students can practice core chapter question banks, attempt mock exams, and view step-by-step answer derivations for free. Optional Pro upgrades offer extended question banks, advanced diagnostic analytics, and priority AI tutoring. Please note that all Pro memberships are digital purchases subject to a strict no-refunds policy."
      }
    },
    {
      "@type": "Question",
      "name": "How is Boardly different from live classes on schaorlio.me?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Boardly focuses strictly on self-paced MCQ testing, active question drills, and diagnostic analytics. Live video lectures, scheduled classes, and teacher-led mentoring sessions are hosted separately on schaorlio.me."
      }
    },
    {
      "@type": "Question",
      "name": "Does Boardly provide explanations for MCQ answers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, every question includes a complete step-by-step explanation and formula derivation. You can also chat directly with the 24/7 AI Study Buddy tutor to ask follow-up questions about complex numericals or definitions."
      }
    },
    {
      "@type": "Question",
      "name": "Is Boardly part of SHS Virtual Academy?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, Boardly is an educational initiative developed and operated under SHS Virtual Academy (shsvirtualacademy.pro). SHS Virtual Academy provides overall curriculum direction, student mentorship, and academic leadership, while Boardly serves as the specialized testing portal."
      }
    }
  ]
}

    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('boardly_theme');
          var isLight = saved === 'light';
          document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
          if (isLight) {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#EEF2FB';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#070B14';
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', isLight ? '#EEF2FB' : '#070B14');
        } catch (e) {}
      })();
    </script>

    <!-- Requirement 1: Ambient background layer with blurred blobs and 48px grid -->
    <div class="boardly-ambient-bg" aria-hidden="true"></div>
    <div id="root">
      <!-- Minimal lightweight loader until React tree mounts -->
      <div id="initial-preloader" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background-color: #070B14;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background-color: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px); animation: initial-pulse 1.8s ease-in-out infinite;">
          <img src="https://pub-51ccade1f191417389ac7df61830c670.r2.dev/file_00000000e98c8211a04e8f3473512ef4.png" alt="Boardly Logo" style="width: 48px; height: 48px; object-fit: contain; border-radius: 14px;" />
        </div>
        <div style="height: 14px; width: 140px; background-color: rgba(255,255,255,0.08); border-radius: 9999px; margin-top: 18px; animation: initial-pulse 1.8s ease-in-out infinite;"></div>
        <div style="height: 10px; width: 200px; background-color: rgba(255,255,255,0.04); border-radius: 9999px; margin-top: 10px; animation: initial-pulse 1.8s ease-in-out infinite;"></div>
        <style>
          @keyframes initial-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.98); }
          }
        </style>
      </div>
    </div>
    <script>
      // Safe no-op hook for preloader timer clearance
      window.__boardlyClearPreloaderTimer = function() {
        var el = document.getElementById('initial-preloader');
        if (el && el.parentNode) {
          // Cleanly release preloader if still present
          el.parentNode.removeChild(el);
        }
      };
    </script>
