    <script>
      (function() {
        try {
          var saved = localStorage.getItem('boardly-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = 'dark';
          if (saved === 'light') effective = 'light';
          else if (saved === 'dark') effective = 'dark';
          else if (saved === 'system') effective = systemDark ? 'dark' : 'light';

          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-theme-setting', saved || 'dark');
          document.documentElement.style.colorScheme = effective;
          if (effective === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', effective === 'dark' ? '#000000' : '#F8F9FA');
          }

          // Automatic Smooth Mode (Lite Mode) detection for low-end phones & slow connections
          var smoothPref = localStorage.getItem('boardly-smooth-mode');
          var smoothActive = false;
          if (smoothPref === 'true' || smoothPref === '1' || smoothPref === 'on') {
            smoothActive = true;
          } else if (smoothPref === 'false' || smoothPref === '0' || smoothPref === 'off') {
            smoothActive = false;
          } else {
            var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var lowMem = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4;
            var lowCpu = typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency <= 4;
            var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            var slowNet = conn && (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.effectiveType === '3g');
            smoothActive = Boolean(reducedMotion || lowMem || lowCpu || slowNet);
          }
          if (smoothActive) {
            document.documentElement.classList.add('smooth-mode');
            document.documentElement.setAttribute('data-smooth-mode', 'true');
          } else {
            document.documentElement.setAttribute('data-smooth-mode', 'false');
          }
        } catch (e) {}
      })();
    </script>
