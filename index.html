<!doctype html>
<html lang="en" class="bg-[#F8F9FB] light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardly — Official Portal of SHS Virtual Academy</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F8F9FB" id="theme-color-meta" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <script>
      (function() {
        try {
          localStorage.removeItem('boardly_theme');
          localStorage.removeItem('shs_theme');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F8F9FB';
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', '#F8F9FB');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FB] text-slate-900 antialiased selection:bg-[#1E5AFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
