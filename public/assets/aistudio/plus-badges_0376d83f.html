<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLUS badges redesign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#0c0c10;--card:#17171d;--card2:#202028;--fg:#f2f2f5;--mu:#9a9aa6;--ln:#2a2a33;--red:#d7191f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f6;--card:#fff;--card2:#ececf2;--fg:#15151a;--mu:#6a6a76;--ln:#dcdce4}}
:root[data-theme="dark"]{--bg:#0c0c10;--card:#17171d;--card2:#202028;--fg:#f2f2f5;--mu:#9a9aa6;--ln:#2a2a33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
body{padding:16px 14px 40px;max-width:560px;margin:0 auto}
h1{font-size:19px;margin:6px 0 4px}
.sub{margin:0 0 14px;font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:14px}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mu{color:var(--mu);font-weight:500;font-size:12px}
.msg{font-size:13.5px;color:var(--mu);margin-top:2px}
.rk{width:30px;color:var(--mu);font-size:13px}
.sc{margin-left:auto;font-weight:600;font-size:14px}
.big{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit;font:inherit;cursor:pointer}
.cell.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,31,.18)}
.cell .n{font-size:12.5px;font-weight:600;text-align:center}
.cell .n small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.cell .eq{font-size:11.5px;font-weight:600;color:var(--mu)}
.cell.on .eq{color:var(--red)}
/* badge */
.pb{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:.09em;padding:5px 10px;border-radius:999px;border:1px solid transparent;position:relative;overflow:hidden;white-space:nowrap;vertical-align:middle}
.pb i{font-style:normal;font-size:11px}
.pb.l{font-size:14px;padding:7px 14px}
.px{font-family:"DotGothic16",monospace}
.spl i{color:#1b1400;margin-right:6px}
.flow{background-size:300% 100%!important;animation:fl 4s linear infinite}
@keyframes fl{to{background-position:-300% 0}}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.glitch{animation:gl 2.4s steps(1) infinite}
@keyframes gl{0%,90%,100%{transform:none}92%{transform:translateX(-1px)}95%{transform:translateX(1px)}}
.pulse i,.twk i{animation:pu 1.5s ease-in-out infinite}
@keyframes pu{50%{opacity:.25}}
.scan::after{content:"";position:absolute;top:0;bottom:0;left:0;width:2px;background:#ef4444;box-shadow:0 0 6px #ef4444;animation:sc 2s linear infinite}
@keyframes sc{to{left:100%}}
.bar{animation:bp 1s linear infinite}
@keyframes bp{to{background-position:var(--t,17px) 0}}
.mo{animation:mo 3s ease-in-out infinite}
@keyframes mo{50%{border-radius:40% 60% 45% 55%/60% 40% 60% 40%}}
.hp{animation:hp 1.2s steps(1) infinite}
@keyframes hp{50%{filter:brightness(1.6)}}
.fill::before{content:"";position:absolute;left:-50%;width:200%;height:100%;bottom:-60%;background:rgba(255,255,255,.28);border-radius:42%;animation:fi 4s ease-in-out infinite}
@keyframes fi{0%{transform:translateY(60%) rotate(0)}50%{transform:translateY(-20%) rotate(180deg)}100%{transform:translateY(60%) rotate(360deg)}}
.fp{animation:fp 4s ease-in-out infinite}
@keyframes fp{0%,86%,100%{transform:rotateX(0)}93%{transform:rotateX(90deg)}}
.typ i{animation:ty 1.2s ease-in-out infinite;letter-spacing:.15em}
@keyframes ty{50%{opacity:.3}}
.cur::after{content:"_";animation:bl 1s steps(1) infinite}
.cur i{color:#f59e0b}
@keyframes bl{50%{opacity:0}}
.ul{animation:fu 3s linear infinite}
@keyframes fu{to{background-position:-300% 100%}}
.hue{animation:hu 6s linear infinite}
.stk::after{content:"";position:absolute;right:0;bottom:0;width:9px;height:9px;background:linear-gradient(135deg,var(--card) 50%,#e8e8ee 50%)}
@keyframes hu{to{filter:hue-rotate(360deg)}}
.ember{background-size:100% 300%!important;animation:fv 3s ease-in-out infinite}

.halo{overflow:visible!important;margin-top:9px}
.halo::before{content:"";position:absolute;top:-8px;left:50%;width:24px;height:7px;margin-left:-12px;border:2px solid #ffd45c;border-radius:50%;box-shadow:0 0 8px #ffd45c;animation:hf 2.4s ease-in-out infinite}
@keyframes hf{50%{transform:translateY(-2px);opacity:.7}}
.tilt{animation:ti 3.2s ease-in-out infinite}
@keyframes ti{0%,100%{transform:perspective(70px) rotateY(-16deg)}50%{transform:perspective(70px) rotateY(16deg)}}
.au{animation:au 7s linear infinite}
@keyframes au{to{background-position:-200% 0,260% 0,-80% 0}}
.rain::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(74,222,128,.4) 0 1px,transparent 1px 6px);-webkit-mask:repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 7px);mask:repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 7px);-webkit-mask-size:100% 14px;mask-size:100% 14px;animation:rn .8s linear infinite}
@keyframes rn{to{-webkit-mask-position:0 14px;mask-position:0 14px}}
.sw{animation:sw 3s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(2.5deg) translateY(-1px)}}
.fire{animation:fr 1.2s ease-in-out infinite}
@keyframes fr{50%{background-position:0 -4px,3px -2px,-3px -3px}}
.zap{animation:zp 3.5s steps(1) infinite}
@keyframes zp{0%,90%,100%{filter:none}92%{filter:brightness(2.4)}94%{filter:none}96%{filter:brightness(2)}}
.spk{animation:spk 2.5s ease-in-out infinite}
@keyframes spk{50%{filter:brightness(1.4) saturate(1.2)}}
.spn i{display:inline-block;animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.coin{animation:cn 2.6s ease-in-out infinite}
@keyframes cn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.18)}}
.sun{animation:sn 4s ease-in-out infinite}
@keyframes sn{50%{background-position:0 -3px,0 0}}
.lqc{background-size:100% 220%!important;animation:lq 3s ease-in-out infinite}
@keyframes lq{50%{background-position:0 100%}}
.fk{animation:fk 3.4s steps(1) infinite}
@keyframes fk{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.3}}
.star::after{content:"";position:absolute;top:25%;left:-20%;width:14px;height:1px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);animation:ss 3s linear infinite}
@keyframes ss{to{left:120%;top:70%}}
.live i{position:relative}
.live i::after{content:"";position:absolute;inset:-3px;border:1.5px solid #fff;border-radius:50%;animation:rp 1.6s ease-out infinite}
@keyframes rp{from{transform:scale(.4);opacity:1}to{transform:scale(2);opacity:0}}
.gx{animation:gx 1.6s steps(1) infinite}
@keyframes gx{0%{text-shadow:-2px 0 #0ff,2px 0 #f0f}20%{text-shadow:2px 0 #0ff,-2px 0 #f0f;transform:translateX(1px)}40%{text-shadow:-1px 1px #0ff,1px -1px #f0f;transform:none}60%{text-shadow:-3px 0 #0ff,3px 0 #f0f;transform:translateX(-1px)}80%{text-shadow:1px 0 #0ff,-1px 0 #f0f;transform:none}}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.orbit{animation:ob 2.6s linear infinite}
@keyframes ob{to{--a:360deg}}
.mq{animation:mq 1s steps(1) infinite}
.live2 i{display:none}
.live2::before{content:"";width:18px;height:12px;flex:none;background:linear-gradient(#fff,#fff) 0 100%/3px 30% no-repeat,linear-gradient(#fff,#fff) 5px 100%/3px 60% no-repeat,linear-gradient(#fff,#fff) 10px 100%/3px 90% no-repeat,linear-gradient(#fff,#fff) 15px 100%/3px 50% no-repeat;animation:lv .9s ease-in-out infinite}
@keyframes lv{0%,100%{background-size:3px 30%,3px 60%,3px 90%,3px 50%}50%{background-size:3px 90%,3px 40%,3px 55%,3px 100%}}
@keyframes mq{50%{border-color:#ff3d00}}
@media (prefers-reduced-motion:reduce){.pb,.pb *,.pb::before,.pb::after{animation:none!important}}
</style>
</head>

['Racing Check','background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px;color:#e11d1d;text-shadow:-1px 0 #fff,1px 0 #fff,0 -1px #fff,0 1px #fff,0 0 4px #fff;border:2px solid #111;border-radius:3px;--t:12px','bar','⚑'],
['Soft Neumorph','background:#e3e8ef;color:#64748b;box-shadow:5px 5px 10px rgba(0,0,0,.35),-4px -4px 9px rgba(255,255,255,.35)','','◍'],
['Underline Flow','background:linear-gradient(90deg,#f43f5e,#f59e0b,#22c55e,#3b82f6,#f43f5e) 0 100%/300% 3px no-repeat;color:var(--fg);border-radius:0;padding:5px 2px 7px','ul','✎'],
['Parchment Scroll','background:radial-gradient(ellipse at center,#fff3c4 55%,#d6a85a);color:#5b3a0a;border-radius:10px/14px;font-family:Georgia,serif;font-style:italic;letter-spacing:.04em;box-shadow:inset 0 0 6px rgba(120,70,10,.5)','','❧'],
['Gem Facets','background:conic-gradient(from 45deg at 50% 50%,#ff7aa2,#c04bff,#4bb0ff,#4bffd0,#ffe66b,#ff7aa2);color:#1a0b2e;border-radius:0;padding:6px 18px;clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%)','hue','◊']
];
var cur=1;
function pb(n,l){var b=B[n-1];return '<span class="pb '+b[2]+(l?' l':'')+'" style="'+b[1]+'"><i>'+b[3]+'</i>PLUS</span>'}
function num(n){return (n<10?'0':'')+n}
function paint(){
  var els=document.querySelectorAll('[data-b]');
  for(var i=0;i<els.length;i++)els[i].innerHTML=pb(cur,els[i].getAttribute('data-b')==='l');
  document.getElementById('cur').textContent='#'+num(cur)+' '+B[cur-1][0];
  var cs=document.querySelectorAll('.cell');
  for(var j=0;j<cs.length;j++){var on=(j+1)===cur;cs[j].classList.toggle('on',on);cs[j].querySelector('.eq').textContent=on?'Equipped':'Equip'}
}
var g=document.getElementById('grid'),h='';
for(var k=1;k<=B.length;k++){h+='<button class="cell" data-n="'+k+'">'+pb(k,true)+'<div class="n">#'+num(k)+' '+B[k-1][0]+(B[k-1][4]?'<small>Static</small>':'')+'</div><span class="eq">Equip</span></button>'}
g.innerHTML=h;
g.addEventListener('click',function(e){var c=e.target.closest('.cell');if(c){cur=+c.getAttribute('data-n');paint()}});
paint();
</script>
</body>
</html>
